<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PC Anatomy - WebGL Runtime Validation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a1e; }
    #app { width: 100%; height: 100%; display: block; }

    .panel {
      position: absolute;
      font-family: "Segoe UI", Consolas, monospace;
      font-size: 12px;
      color: #e8e8ec;
      background: rgba(20, 20, 26, 0.88);
      border: 1px solid #3a3a44;
      border-radius: 8px;
      padding: 10px 12px;
      user-select: none;
      z-index: 10;
    }

    #hud { top: 12px; left: 12px; min-width: 240px; }
    #hud h1 { font-size: 13px; margin-bottom: 6px; color: #8fd3ff; letter-spacing: 0.5px; }
    #hud .row { display: flex; justify-content: space-between; gap: 14px; line-height: 1.55; }
    #hud .row .k { color: #9a9aa6; }
    #hud .ok  { color: #7ee787; font-weight: 600; }
    #hud .bad { color: #ff7b72; font-weight: 600; }
    #fps { color: #ffd866; font-weight: 600; }

    #stages { top: 12px; right: 12px; width: 220px; }
    #stages h2 { font-size: 12px; color: #8fd3ff; margin-bottom: 8px; letter-spacing: 0.5px; }
    #stages .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
    #stages button {
      font-family: inherit; font-size: 11px;
      padding: 7px 4px;
      background: #2b2b34; color: #e8e8ec;
      border: 1px solid #44444f; border-radius: 5px;
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s;
    }
    #stages button:hover { background: #3a3a46; border-color: #6a6a78; }
    #stages button.active { background: #1d4ed8; border-color: #3b82f6; color: #fff; }
    #stages button.warn { background: #7a2d2d; border-color: #b45050; }
    #stages .wide { grid-column: 1 / -1; }
    #stages .cable { background: #1e3a2f; border-color: #2f6b4f; }
    #stages .cable:hover { background: #27503f; }
    #stages .speed { margin-top: 8px; display: flex; align-items: center; gap: 8px; color: #9a9aa6; }
    #stages .speed input { flex: 1; }
    #now-playing { margin-top: 8px; color: #ffd866; min-height: 15px; word-break: break-all; }

    #animnames { bottom: 12px; left: 12px; max-width: 420px; max-height: 180px; overflow-y: auto; }
    #animnames h2 { font-size: 12px; color: #8fd3ff; margin-bottom: 6px; }
    #animnames li { list-style: none; line-height: 1.5; color: #c8c8d2; font-size: 11px; }

    #fatal {
      position: absolute; inset: 0;
      display: none; align-items: center; justify-content: center;
      background: rgba(10, 10, 14, 0.92); z-index: 100;
      color: #ff7b72; font-family: Consolas, monospace;
      font-size: 28px; letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <canvas id="app"></canvas>

  <div id="hud" class="panel">
    <h1>PC ANATOMY &mdash; RUNTIME VALIDATION</h1>
    <div class="row"><span class="k">FPS</span><span id="fps">--</span></div>
    <div class="row"><span class="k">GLB loaded</span><span id="d-glb" class="bad">NO</span></div>
    <div class="row"><span class="k">Meshopt loaded</span><span id="d-meshopt" class="bad">NO</span></div>
    <div class="row"><span class="k">Node count</span><span id="d-nodes">-</span></div>
    <div class="row"><span class="k">Mesh count</span><span id="d-meshes">-</span></div>
    <div class="row"><span class="k">Material count</span><span id="d-mats">-</span></div>
    <div class="row"><span class="k">Animation count</span><span id="d-anims">-</span></div>
  </div>

  <div id="stages" class="panel">
    <h2>ANIMATION TEST CONTROLS</h2>
    <div class="grid" id="stage-grid"></div>
    <div class="speed">
      <span>speed</span>
      <input id="speed" type="range" min="0.25" max="4" step="0.25" value="1" />
      <span id="speed-val">1x</span>
    </div>
    <div id="now-playing"></div>
  </div>

  <div id="animnames" class="panel">
    <h2>EXPORTED ANIMATION CLIPS</h2>
    <ul id="anim-list"></ul>
  </div>

  <div id="fatal"></div>

  <script type="module" src="./main.js"></script>
</body>
</html>
